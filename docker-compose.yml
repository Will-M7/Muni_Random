services:
  mysql:
    image: mysql:8.4
    container_name: san-miguel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-san_miguel}
      MYSQL_USER: ${DB_USER:-sanmiguel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sanmiguel_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - san_miguel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  san_miguel_mysql_data:
