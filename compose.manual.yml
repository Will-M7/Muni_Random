# Persistent local application; reuses ONLY the audited v20_manual database.
services:
  backend:
    image: sm-integration-20261013-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: manual-qa
      TZ: America/Lima
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_TARGET: "29"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      DB_HOST: mysql-audit
      DB_PORT: "3306"
      DB_NAME: v20_manual
      DB_USER: root
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      APP_STORAGE_PATH: /app/uploads/solicitudes
      APP_DILIGENCIAS_PATH: /app/uploads/diligencias
    secrets:
      - source: manual_db_password
        target: spring.datasource.password
      - source: identity_master_key
        target: app.identity.master-key
    volumes:
      - manual_uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks: [private, egress]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      retries: 18
      start_period: 20s
  frontend:
    image: sm-integration-20261013-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docker/nginx.manual.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4200:80"
    networks: [private, edge]
networks:
  private:
    external: true
    name: sm-manual-private
  egress: {}
  edge: {}
volumes:
  manual_uploads:
    external: true
    name: sm-manual-uploads-20261013
secrets:
  manual_db_password:
    file: ./.local/integration-20261013/manual_db_password
  identity_master_key:
    file: ./.local/integration-20261013/identity_master_key
