<header class="topbar" *ngIf="!esRutaLogin && !esFiscalizador">
  <a [routerLink]="esAdmin ? '/admin' : (esMunicipio ? '/expedientes' : '/fiscalizador')" class="brand" aria-label="Ir al inicio institucional">
    <img class="brand-mark" src="/assets/imagenes/logo_muni.jpeg" alt="Escudo de la Municipalidad Distrital de San Miguel">
    <span>
      <strong>San Miguel</strong>
      <small>Municipalidad Distrital de San Miguel</small>
    </span>
  </a>

  <nav aria-label="Navegación principal">
    <a *ngIf="authService.hasCapability('EXPEDIENTE_VER')" routerLink="/expedientes" routerLinkActive="active">Fiscalizaciones</a>
    <a *ngIf="authService.hasCapability('EXPEDIENTE_CREAR')" routerLink="/expedientes/nuevo" routerLinkActive="active">Crear fiscalización</a>
    <a *ngIf="(authService.session?.roles?.includes('MUNICIPIO') || authService.session?.rol === 'MUNICIPIO') && authService.hasCapability('REVISION_VER')" routerLink="/revisiones" routerLinkActive="active">Pendientes de revisión</a>
    <a *ngIf="esMunicipio && puedeVerUsuarios" routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
    <a *ngIf="esAdmin" routerLink="/admin" routerLinkActive="active">Administración</a>
  </nav>

  <div class="topbar-right">
    <button type="button" class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</header>

<router-outlet></router-outlet>
