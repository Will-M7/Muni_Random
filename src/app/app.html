<header class="topbar" *ngIf="!esRutaLogin && !esFiscalizador">
  <a routerLink="/inicio" class="brand" aria-label="Ir al inicio institucional">
    <img class="brand-mark" src="/assets/imagenes/logo_muni.jpeg" alt="Escudo de la Municipalidad Distrital de San Miguel">
    <span>
      <strong>San Miguel</strong>
      <small>Municipalidad Distrital de San Miguel</small>
    </span>
  </a>

  <nav aria-label="Navegación principal">
    <a *ngIf="esMunicipio" routerLink="/inicio" routerLinkActive="active">Inicio</a>
    <a *ngIf="esMunicipio" routerLink="/nueva-solicitud" routerLinkActive="active">Registrar solicitud</a>
    <a *ngIf="esMunicipio" routerLink="/solicitudes" routerLinkActive="active">Solicitudes</a>
    <a *ngIf="esMunicipio" routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
  </nav>

  <div class="topbar-right">
    <button type="button" class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión e ir al Login">
      <small>Cerrar sesión</small>
    </button>
  </div>
</header>

<router-outlet></router-outlet>
