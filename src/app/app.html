<header class="topbar" *ngIf="!esRutaLogin && !esFiscalizador">
  <a [routerLink]="esAdmin ? '/admin' : (esMunicipio ? '/expedientes' : '/fiscalizador')" class="brand" aria-label="Ir al inicio institucional">
    <img class="brand-mark" src="/assets/imagenes/logo_muni.jpeg" alt="Escudo de la Municipalidad Distrital de San Miguel">
    <span>
      <strong>San Miguel</strong>
      <small>Municipalidad Distrital de San Miguel</small>
    </span>
  </a>

  <nav aria-label="Navegación principal">
    <a *ngIf="authService.hasCapability('EXPEDIENTE_VER')" routerLink="/expedientes" routerLinkActive="active">Fiscalizaciones</a>
    <a *ngIf="authService.hasCapability('EXPEDIENTE_CREAR')" routerLink="/expedientes/nuevo" routerLinkActive="active">Nuevo expediente</a>
    <a *ngIf="esMunicipio && puedeVerUsuarios" routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
    <a *ngIf="esAdmin" routerLink="/admin" routerLinkActive="active">Administración</a>
  </nav>

  <div class="topbar-right">
    <button type="button" class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión e ir al Login">
      <small>Cerrar sesión</small>
    </button>
  </div>
</header>

<router-outlet></router-outlet>
