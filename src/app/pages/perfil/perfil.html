<main class="access-page">
  <section class="access-card">
    <div class="seal-badge">SM</div>
    <p class="eyebrow">MUNICIPALIDAD DISTRITAL DE SAN MIGUEL</p>
    <h1>Sistema de Verificación Domiciliaria</h1>
    <p class="desc">Sesión interna de {{ sesion?.nombre }}.</p>
    <div class="roles-grid"><article class="role-btn"><span class="role-icon">Cuenta</span><div class="role-text"><strong>{{ sesion?.cargo }}</strong><small>{{ sesion?.correo }}</small></div></article></div>
    <button type="button" class="role-btn" (click)="entrar()"><span class="role-text"><strong>Continuar al sistema</strong><small>Ir a una sección disponible para esta cuenta.</small></span></button>

    <footer class="access-footer">
      <span>Municipalidad Distrital de San Miguel · San Miguel, Lima</span>
      <small>Prototipo Angular 100% Funcional con Almacenamiento Local</small>
    </footer>
  </section>
</main>
