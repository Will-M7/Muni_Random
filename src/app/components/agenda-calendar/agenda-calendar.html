<section class="calendar" aria-label="Calendario mensual de ocupación">
  <header class="calendar-controls"><button type="button" (click)="navigate(-1)" aria-label="Mes anterior">‹</button><h3 aria-live="polite">{{monthLabel}}</h3><button type="button" (click)="navigate(1)" aria-label="Mes siguiente">›</button><label>Año <input type="number" [ngModel]="year" (ngModelChange)="changeYear($event)" [ngModelOptions]="{standalone:true}" min="1900" max="2200"></label><button type="button" (click)="showToday()">Hoy</button></header>
  <p *ngIf="loading" role="status">Consultando ocupación del mes…</p>
  <div class="calendar-grid" role="group" aria-label="Días del mes"><span class="weekday" *ngFor="let day of weekdays">{{day}}</span><ng-container *ngFor="let cell of cells"><span *ngIf="!cell" aria-hidden="true"></span><button *ngIf="cell" type="button" [attr.data-date]="cell.date" class="calendar-day" [class]="'calendar-day '+color(cell.date)" [class.selected]="selected===cell.date" [class.today]="today===cell.date" [attr.aria-label]="label(cell.date)" [attr.aria-pressed]="selected===cell.date" [attr.aria-current]="today===cell.date?'date':null" [attr.tabindex]="focusDate===cell.date||(!focusDate.startsWith(month)&&cell.day===1)?0:-1" [disabled]="!!minimum&&cell.date<minimum" (click)="select(cell.date)" (keydown)="key($event,cell.date)"><b>{{cell.day}}</b><small>{{limit===null?'—':(counts[cell.date]||0)}}<span class="count-label"> visitas</span></small></button></ng-container></div>
  <div class="legend" aria-label="Leyenda de ocupación"><span><i class="neutral"></i>Libre</span><span><i class="green"></i>Baja</span><span><i class="yellow"></i>Desde 80 % hasta el límite</span><span><i class="red"></i>Supera el límite</span></div><p class="capacity-note">{{limit===null?'La ocupación aún no está disponible.':'Límite orientativo: '+limit+' visitas activas por día en tu agenda municipal.'}}</p>
</section>
