spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Lima&characterEncoding=utf8
    username: ${DB_USER}
    password: ${DB_PASSWORD:}
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/production
  jpa:
    hibernate:
      ddl-auto: validate
app:
  bootstrap-admin:
    only-empty-database: true
  jwt:
    secret: ${JWT_SECRET:}
  cors-origins: ${CORS_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
